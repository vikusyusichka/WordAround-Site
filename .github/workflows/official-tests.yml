# Keeps the Exams catalog of official practice tests up to date.
# Every Monday it re-reads the exam owners' pages (ielts.org, cervantes.org),
# checks every link still opens, and commits src/lib/exams/officialTests.json
# when something changed — which redeploys the site on Cloudflare Pages.
# Can also be started by hand: GitHub → Actions → "Official practice tests" → Run workflow.
name: Official practice tests

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Find official practice tests
        run: node scripts/update-official-tests.mjs
      - name: Commit the catalog if it changed
        run: |
          if git diff --quiet -- src/lib/exams/officialTests.json; then
            echo "Catalog unchanged."
            exit 0
          fi
          git config user.name "wordaround-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/exams/officialTests.json
          git commit -m "chore: refresh the official practice tests catalog"
          git push
